# Статика React SPA + прокси /api на бэкенд (один origin — без CORS)
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    include /etc/nginx/mime.types;
    # В mime.types nginx нет .mjs, а воркер pdf.js — ES-модуль: с application/octet-stream браузер его не загрузит
    types { text/javascript mjs; }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    # Файлы сборки с хешем в имени — кэшируются надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Маршруты SPA отдают index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
