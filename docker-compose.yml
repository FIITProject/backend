# Локальная разработка: postgres + S3 (RustFS) + rabbitmq + clamav + migrate + api + web (+ bot с профилем bot).
# Запуск: docker compose up -d --build, затем первый преподаватель:
#   docker compose run --rm migrate add-teacher admin admin-password Иванов Иван Иванович
# Сайт: http://localhost:8080 (API — /api, эмулятор бота — раздел «Бот (эмулятор)»).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: fiit
      POSTGRES_USER: fiit
      POSTGRES_PASSWORD: fiit
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiit -d fiit"]
      interval: 2s
      retries: 30

  # S3-совместимое хранилище вместо Yandex Object Storage
  s3:
    image: rustfs/rustfs:1.0.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: fiit
      RUSTFS_SECRET_KEY: fiit-minio-secret
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/data

  # Очередь уведомлений: API публикует из outbox, бот доставляет в Telegram. Веб-интерфейс — http://localhost:15672 (fiit/fiit)
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fiit
      RABBITMQ_DEFAULT_PASS: fiit
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # Отдельный шаг деплоя: применить миграции тем же образом и выйти. API стартует только после успеха.
  migrate:
    build: .
    init: true
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      ConnectionStrings__Db: Host=db;Database=fiit;Username=fiit;Password=fiit
      Jwt__Key: ${JWT_KEY:-dev-only-key-change-me-dev-only-key-change-me}

  api:
    build: .
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    environment:
      ConnectionStrings__Db: Host=db;Database=fiit;Username=fiit;Password=fiit
      Jwt__Key: ${JWT_KEY:-dev-only-key-change-me-dev-only-key-change-me}
      Bot__Key: ${BOT_KEY:-dev-bot-key}
      Bot__Username: ${BOT_USERNAME:-fiit_hw_bot}
      Storage__ServiceUrl: http://s3:9000
      Storage__AccessKey: fiit
      Storage__SecretKey: fiit-minio-secret
      Storage__Bucket: fiit-homeworks
      Storage__CreateBucket: "true"
      RabbitMq__Uri: amqp://fiit:fiit@rabbitmq:5672/
      ClamAv__Enabled: "true"
      ClamAv__Host: clamav
    ports:
      - "5080:8080"

  # Антивирус для сдаваемых PDF. При первом запуске качает базы сигнатур (1–3 минуты);
  # пока clamd не готов, сдача отвечает «Не удалось проверить файл, попробуйте позже».
  clamav:
    image: clamav/clamav-debian:1.4
    volumes:
      - clamav-data:/var/lib/clamav

  # Telegram-бот. Нужен токен от @BotFather, поэтому запускается отдельно:
  #   TELEGRAM_TOKEN=... BOT_USERNAME=имя_бота docker compose --profile bot up -d --build
  bot:
    profiles: ["bot"]
    init: true
    build:
      context: .
      dockerfile: src/Fiit.Bot/Dockerfile
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    environment:
      Telegram__Token: ${TELEGRAM_TOKEN:-}
      Telegram__Proxy: ${TELEGRAM_PROXY:-}
      Api__BaseUrl: http://api:8080/
      Api__BotKey: ${BOT_KEY:-dev-bot-key}
      RabbitMq__Uri: amqp://fiit:fiit@rabbitmq:5672/

  # Сайт преподавателя (React)
  web:
    build:
      context: .
      dockerfile: web/app/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

  # Временный тестовый сайт на Blazor — нужен ради эмулятора бота, пока React-версия его не умеет
  web-blazor:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  db-data:
  s3-data:
  clamav-data:
  rabbitmq-data:
